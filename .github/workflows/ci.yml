name: CI - Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Gradle, JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify runner tools
        run: |
          node --version
          python3 --version

      - name: Set up JVM build
        uses: ./.github/actions/setup-build

      - name: Test install and uninstall scripts
        run: scripts/test-install.sh

      - name: Test compatibility runner safety checks
        run: node --test src/test/javascript/android_compatibility.test.cjs

      - name: Build, test, lint, and package
        run: ./gradlew build shadowJar jmhClasses generateDocs --no-daemon --stacktrace --warning-mode=all

      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/cli.md

      - name: Smoke test packaged CLI
        run: |
          java -jar build/libs/*-all.jar --help
          java -jar build/libs/*-all.jar faults android --help
          java -jar build/libs/*-all.jar faults ios --help

      - name: Preserve build failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-failure-${{ github.run_attempt }}
          retention-days: 7
          path: |
            build/reports/
            build/test-results/

  ios-integration:
    name: iOS Simulator integration
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up JVM build
        uses: ./.github/actions/setup-build

      - name: Run Instruments integration tests
        id: ios-tests
        shell: bash
        env:
          MPERF_INTEGRATION_ARTIFACTS: ${{ github.workspace }}/build/integration-artifacts
        run: |
          mkdir -p "$MPERF_INTEGRATION_ARTIFACTS"
          for attempt in 1 2; do
            if ./gradlew test --no-daemon --stacktrace \
              -Dmperf.integration.ios.enabled=true \
              --tests com.bromano.mobile.perf.integration.IosProfilerIntegrationTest \
              --tests com.bromano.mobile.perf.gecko.InstrumentsConverterTest \
              2>&1 | tee "$MPERF_INTEGRATION_ARTIFACTS/fixture-attempt-$attempt.log"; then
              exit 0
            fi
            echo "had_failure=true" >> "$GITHUB_OUTPUT"
            attempt_dir="$MPERF_INTEGRATION_ARTIFACTS/attempt-$attempt"
            mkdir -p "$attempt_dir"
            for report in build/reports/tests build/test-results; do
              if [ -d "$report" ]; then cp -R "$report" "$attempt_dir/"; fi
            done
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Xcode failed the live integration run; resetting Simulators and retrying once"
            xcrun simctl shutdown all || true
          done

      - name: Preserve iOS fixture failure evidence
        if: failure() || steps.ios-tests.outputs.had_failure == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-fixture-failure-${{ github.run_attempt }}
          retention-days: 7
          path: |
            build/reports/tests/
            build/test-results/
            build/integration-artifacts/

  android-integration:
    name: Android emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JVM build
        uses: ./.github/actions/setup-build

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Perfetto and Simpleperf integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run-android-integration.sh emulator-5554 35 4096

      - name: Preserve Android fixture failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-fixture-failure-${{ github.run_attempt }}
          retention-days: 7
          path: |
            build/reports/tests/
            build/test-results/
            build/integration-artifacts/
            integration-fixtures/android/*/build/reports/
