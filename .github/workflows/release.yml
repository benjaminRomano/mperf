name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be SemVer values such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on the main branch" >&2
            exit 1
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Test install and uninstall scripts
        run: scripts/test-install.sh

      - name: Build (tests + fat jar)
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' from the tag for the module version (e.g., v1.2.3 -> 1.2.3)
          TAG_NO_V="${RELEASE_VERSION#v}"
          echo "Building release version: $TAG_NO_V"
          ./gradlew --no-daemon --stacktrace --warning-mode=all \
            -PreleaseVersion="$TAG_NO_V" clean build shadowJar generateDocs

      - name: Run iOS integration tests
        run: |
          for attempt in 1 2; do
            if ./gradlew test --no-daemon --stacktrace \
              -Dmperf.integration.ios.enabled=true \
              --tests com.bromano.mobile.perf.integration.IosProfilerIntegrationTest \
              --tests com.bromano.mobile.perf.gecko.InstrumentsConverterTest; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Xcode failed the live integration run; resetting Simulators and retrying once"
            xcrun simctl shutdown all || true
          done

      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/cli.md

      - name: Locate artifact
        id: artifact
        run: |
          TAG_NO_V="${GITHUB_REF_NAME#v}"
          # Expect the jar to contain the version in the filename
          JAR_PATH="build/libs/mperf-${TAG_NO_V}-all.jar"
          test -f "$JAR_PATH"
          java -jar "$JAR_PATH" --help >/dev/null
          test "$(unzip -p "$JAR_PATH" META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')" = "$TAG_NO_V"
          echo "Found jar: $JAR_PATH"
          echo "jar=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: prep
        run: |
          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"
          SRC_JAR="${{ steps.artifact.outputs.jar }}"
          BASENAME=$(basename "$SRC_JAR")
          cp "$SRC_JAR" "$OUT_DIR/$BASENAME"
          (cd "$OUT_DIR" && shasum -a 256 "$BASENAME" > "$BASENAME.sha256")
          (cd "$OUT_DIR" && shasum -a 256 -c "$BASENAME.sha256")
          echo "asset_jar=$OUT_DIR/$BASENAME" >> "$GITHUB_OUTPUT"
          echo "asset_sum=$OUT_DIR/$BASENAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.prep.outputs.asset_jar }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.prep.outputs.asset_jar }}
            ${{ steps.prep.outputs.asset_sum }}
